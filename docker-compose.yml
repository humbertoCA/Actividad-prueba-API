
services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENV=docker
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootroot"]
      interval: 5s
      retries: 5